# PHP
[program:php]
directory=/srv/app
# Wrapped, because the application is generated rather than tracked - see serve.bash
command=/srv/meta/scripts/serve.bash
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

# CSS Watch
[program:css]
directory=/srv/app
command=/usr/bin/npm run css:watch
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

# Js Watch
[program:js]
directory=/srv/app
command=/usr/bin/npm run js:watch
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
