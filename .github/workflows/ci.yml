name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is composer.json's "php": ">=8.4", which is also what the Dockerfile
        # builds; the second entry keeps us honest against the current release
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # intl is required by ExtendedDateTime; the rest match docker/app/Dockerfile
          # pdo_sqlite backs the migration engine's integration tests - they run against a
          # real database in a temp file, so no service container is needed
          extensions: intl, mbstring, xml, zip, gd, bcmath, pdo_pgsql, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --optimize-autoloader

      # No application is tracked - presets/ is the source - so lay one down first
      - name: Scaffold the default application
        run: ./staticphp app add Application --preset=twig

      - name: Run PHP code tests
        run: ./scripts/code_tests.bash php

  js:
    name: JS / TS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Scaffold the default application
        run: ./staticphp app add Application --preset=twig

      - name: Run JS code tests
        run: ./scripts/code_tests.bash js

      - name: Build assets
        run: |
          npm run css:build
          npx rspack build --mode production

  presets:
    name: Preset ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every preset is scaffolded and exercised. Preset sources sit outside src/, so
        # nothing else in this workflow ever compiles them - without this job the flavour
        # nobody used this quarter breaks quietly and is only found by the next person who
        # reaches for it.
        preset: [twig, react]

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, xml, zip, gd, bcmath, pdo_pgsql, pdo_mysql, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --optimize-autoloader
          npm ci --no-audit --no-fund

      - name: Scaffold an application from the preset
        run: ./staticphp app add Probe --preset=${{ matrix.preset }}

      - name: Install anything the preset added to package.json
        run: npm install --no-audit --no-fund

      - name: Build its assets
        run: npm run build:dev

      - name: Run its tests
        run: php vendor/bin/phpunit -c src/Probe/phpunit.xml

      - name: It must answer over http
        run: |
          php -S 127.0.0.1:8123 -t src/Probe/Public &
          for _ in $(seq 1 50); do
            curl -fsS -o /dev/null http://127.0.0.1:8123/ && break
            sleep 0.2
          done
          curl -fsS -o /dev/null -w 'GET / -> %{http_code}\n' http://127.0.0.1:8123/

  upgrade:
    name: Upgrade a generated project
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # The upgrader reads the origin's tags, so it needs them all - and the historical
          # tag below has to actually be there
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, xml, zip, gd, bcmath, pdo_pgsql, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --optimize-autoloader

      # Two tags off this commit: the tree as it is, and the tree with a change in each of
      # the places an upgrade has to reach - a root config, a shipped script, and a preset
      # file that an already-scaffolded application would otherwise never see.
      #
      # Synthetic rather than a real historical tag on purpose. The unit tests prove the
      # classification; the point of this job is that it survives contact with the actual
      # tree, and a pair built here keeps that honest as the repository moves on.
      - name: Tag a before and an after
        run: |
          git config user.email ci@example.invalid
          git config user.name CI
          git tag -f v99.0.0-ci
          printf '\n// upstream change\n' >> rspack.config.js
          printf '\n# upstream change\n' >> scripts/clear_cache.bash
          printf '\n// upstream change\n' >> presets/_base/Public/dev-router.php
          git commit -qam 'next release'
          git tag -f v99.1.0-ci

      - name: Generate a project from the earlier one
        run: |
          git clone --quiet --shared . /tmp/project
          cd /tmp/project
          git checkout --quiet v99.0.0-ci
          # Copied and re-dumped rather than symlinked: the autoloader has to resolve
          # StaticPHP\Skeleton\ to *this* project's lib/, or the job would be exercising the
          # workspace's copy of the upgrader and proving nothing about the generated one
          cp -al "$GITHUB_WORKSPACE/vendor" vendor
          composer dump-autoload --quiet
          SP_PRESET=twig php scripts/post_create_project.php --new-project

      - name: Record where it came from, and edit one file as a developer would
        run: |
          cd /tmp/project
          printf '\n// local change\n' >> rspack.config.js
          php -r '
            require "vendor/autoload.php";
            $m = StaticPHP\Skeleton\Manifest::load(".");
            $m->origin = getenv("GITHUB_WORKSPACE");
            $m->skeleton = "v99.0.0-ci";
            $m->setApp("Application", "twig", "v99.0.0-ci");
            $m->save(".");
          '
          git -c user.email=ci@example.invalid -c user.name=CI add -A
          git -c user.email=ci@example.invalid -c user.name=CI commit -qm generated

      # One command for the whole project: the skeleton files and every application the
      # manifest records, all onto the same tag
      - name: Upgrade it
        run: |
          cd /tmp/project
          php staticphp upgrade --to=v99.1.0-ci --yes

      - name: The right things moved, and the local edit did not
        run: |
          cd /tmp/project
          grep -q 'upstream change' scripts/clear_cache.bash
          grep -q 'upstream change' src/Application/Public/dev-router.php
          grep -q 'local change' rspack.config.js
          # Changed on both sides, so --yes must have left it entirely alone
          ! grep -q 'upstream change' rspack.config.js

      - name: No merge markers may be left behind
        run: |
          cd /tmp/project
          if grep -rIn --exclude-dir=vendor --exclude-dir=.git -e '^<<<<<<< mine' .; then
            echo "an unattended upgrade left conflict markers" >&2
            exit 1
          fi

      # A second run has to be a no-op. This is what catches a broken manifest writer - the
      # failure mode that would quietly spoil everyone's next upgrade.
      - name: Upgrading again changes nothing
        run: |
          cd /tmp/project
          git -c user.email=ci@example.invalid -c user.name=CI add -A
          git -c user.email=ci@example.invalid -c user.name=CI commit -qm upgraded --allow-empty
          php staticphp upgrade --to=v99.1.0-ci --yes | tee /tmp/second.log
          grep -q 'already on v99.1.0-ci' /tmp/second.log
          git diff --exit-code

  build-info:
    name: Build info
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # scripts/build_info.bash derives the patch number from the commit count, so it
          # needs the full history - a shallow clone would silently produce version .1
          fetch-depth: 0

      - name: Generate build info
        run: ./scripts/build_info.bash

      - name: Show it
        run: cat .build_info.json
